name: Verify game
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rules-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Verify self-contained assets
        run: python3 tests/static_check.py
